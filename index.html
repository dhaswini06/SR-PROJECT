<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech ↔ Text ↔ Animal Voice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Speech ↔ Text ↔ Animal Voice</h1>

    <!-- Step A: Speech-to-Text -->
    <section>
      <h2>1. Speech → Text</h2>
      <button id="micBtn">🎤 Start Speaking</button>
      <button id="micStopBtn" disabled>■ Stop</button>
      <p id="micStatus">Not listening</p>
    </section>

    <!-- Step B: The shared text box -->
    <section>
      <h2>2. Text</h2>
      <textarea id="textBox" rows="4" placeholder="Speak above, or type here..."></textarea>
    </section>

    <!-- Step C: Text-to-Speech, normal voice -->
    <section>
      <h2>3. Text → Speech (normal voice)</h2>
      <button id="speakNormalBtn">🔊 Speak Normally</button>
    </section>

    <!-- Step D: Animal voice mode -->
    <section>
      <h2>4. Speak as an Animal</h2>
      <select id="animalSelect">
        <option value="none">-- Choose an animal --</option>
        <option value="cat">🐱 Cat</option>
        <option value="dog">🐶 Dog</option>
        <option value="cow">🐮 Cow</option>
        <option value="mouse">🐭 Mouse</option>
        <option value="lion">🦁 Lion</option>
      </select>
      <button id="speakAnimalBtn">🔊 Speak as Animal</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
